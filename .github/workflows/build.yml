name: Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Fix Kotlin language version for Flutter Gradle plugin
        run: |
          echo "=== Debug: FLUTTER_ROOT=$FLUTTER_ROOT ==="
          GRADLE_DIR="$FLUTTER_ROOT/packages/flutter_tools/gradle"
          echo "=== Listing $GRADLE_DIR ==="
          ls -la "$GRADLE_DIR" || echo "Directory not found"
          echo "=== Patching build scripts ==="
          for f in "$GRADLE_DIR/build.gradle.kts" "$GRADLE_DIR/build.gradle"; do
            if [ -f "$f" ]; then
              echo "Found: $f"
              echo "--- Before (last 5 lines) ---"
              tail -5 "$f"
            fi
          done
          if [ -f "$GRADLE_DIR/build.gradle.kts" ]; then
            printf '\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n    compilerOptions {\n        languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)\n        apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)\n    }\n}\n' >> "$GRADLE_DIR/build.gradle.kts"
            echo "--- After patch (last 10 lines) ---"
            tail -10 "$GRADLE_DIR/build.gradle.kts"
          fi
          if [ -f "$GRADLE_DIR/build.gradle" ]; then
            printf '\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n    compilerOptions {\n        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9\n        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9\n    }\n}\n' >> "$GRADLE_DIR/build.gradle"
            echo "--- After patch (last 10 lines) ---"
            tail -10 "$GRADLE_DIR/build.gradle"
          fi
          echo "=== Also creating Gradle init script as fallback ==="
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-kotlin-lang.gradle << 'INITEOF'
          beforeSettings { settings ->
              settings.gradle.afterProject { project ->
                  try {
                      project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                          compilerOptions {
                              languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
                              apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          INITEOF
          echo "Init script created at ~/.gradle/init.d/fix-kotlin-lang.gradle"
          cat ~/.gradle/init.d/fix-kotlin-lang.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare output artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DocTool-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Android
          path: dist/DocTool-Android.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\DocTool-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist/DocTool-Windows-x64.zip

  release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Android
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocTool-Android.apk
            dist/DocTool-Windows-x64.zip
          generate_release_notes: true
