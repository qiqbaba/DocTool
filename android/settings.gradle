pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "7.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"

gradle.allprojects {
    tasks.configureEach { task ->
        if (task.class.name.contains("KotlinCompile")) {
            try {
                task.kotlinOptions.languageVersion = "1.8"
                task.kotlinOptions.apiVersion = "1.9"
                task.kotlinOptions.jvmTarget = "1.8"
                task.kotlinOptions.freeCompilerArgs += ["-language-version", "1.8", "-api-version", "1.9"]
            } catch (Throwable ignored) {}
            try {
                def kv18 = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
                def kv19 = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
                task.compilerOptions.languageVersion.set(kv18)
                task.compilerOptions.apiVersion.set(kv19)
                task.compilerOptions.freeCompilerArgs.addAll(["-language-version", "1.8", "-api-version", "1.9"])
            } catch (Throwable ignored) {}
        }
    }
}

