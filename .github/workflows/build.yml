name: Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Patch Flutter SDK Kotlin language version
        run: |
          FLUTTER_SDK_PATH=$(flutter --no-version-check sdk-path 2>/dev/null || echo "")
          if [ -z "$FLUTTER_SDK_PATH" ]; then
            FLUTTER_BIN=$(which flutter)
            FLUTTER_SDK_PATH=$(dirname "$(dirname "$FLUTTER_BIN")")
          fi
          echo "Flutter SDK at: $FLUTTER_SDK_PATH"
          KTS="$FLUTTER_SDK_PATH/packages/flutter_tools/gradle/build.gradle.kts"
          if [ -f "$KTS" ]; then
            echo "" >> "$KTS"
            echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {' >> "$KTS"
            echo '    compilerOptions {' >> "$KTS"
            echo '        languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)' >> "$KTS"
            echo '        apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)' >> "$KTS"
            echo '    }' >> "$KTS"
            echo '}' >> "$KTS"
            echo "Patched build.gradle.kts OK"
          fi
          GROOVY="$FLUTTER_SDK_PATH/packages/flutter_tools/gradle/build.gradle"
          if [ -f "$GROOVY" ]; then
            echo "" >> "$GROOVY"
            echo 'tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {' >> "$GROOVY"
            echo '    compilerOptions {' >> "$GROOVY"
            echo '        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9' >> "$GROOVY"
            echo '        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9' >> "$GROOVY"
            echo '    }' >> "$GROOVY"
            echo '}' >> "$GROOVY"
            echo "Patched build.gradle OK"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare output artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DocTool-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Android
          path: dist/DocTool-Android.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\DocTool-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist/DocTool-Windows-x64.zip

  release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Android
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocTool-Android.apk
            dist/DocTool-Windows-x64.zip
          generate_release_notes: true
