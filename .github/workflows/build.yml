name: Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle Init Script
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/kotlin.gradle
          gradle.allprojects {
              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile")) {
                      try {
                          task.kotlinOptions.languageVersion = "1.8"
                          task.kotlinOptions.apiVersion = "1.8"
                          task.kotlinOptions.jvmTarget = "1.8"
                          task.kotlinOptions.freeCompilerArgs += ["-language-version", "1.8", "-api-version", "1.8"]
                      } catch (Throwable ignored) {}
                      try {
                          def kv18 = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
                          task.compilerOptions.languageVersion.set(kv18)
                          task.compilerOptions.apiVersion.set(kv18)
                          task.compilerOptions.freeCompilerArgs.addAll(["-language-version", "1.8", "-api-version", "1.8"])
                      } catch (Throwable ignored) {}
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare output artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DocTool-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Android
          path: dist/DocTool-Android.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\DocTool-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist/DocTool-Windows-x64.zip

  release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Android
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DocTool-Windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocTool-Android.apk
            dist/DocTool-Windows-x64.zip
          generate_release_notes: true
